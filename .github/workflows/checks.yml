name: Verificações
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verificar segredos no histórico
        shell: pwsh
        run: |
          $scanner = Join-Path $env:RUNNER_TEMP 'gitleaks'
          New-Item -ItemType Directory -Path $scanner -Force | Out-Null
          $archive = Join-Path $scanner 'gitleaks.zip'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Checksum do scanner inválido.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $scanner
          & (Join-Path $scanner 'gitleaks.exe') git . --log-opts='--all' --redact --no-banner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q
      - run: ruff check src tests scripts packaging
      - run: ruff format --check src tests scripts packaging
      - run: python scripts/verify_ui.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verificacao-visual
          path: .local/previews
          retention-days: 7
