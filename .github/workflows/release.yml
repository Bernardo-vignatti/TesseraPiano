name: Publicar versão
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps
      - name: Conferir versão e assinatura
        env:
          TESSERA_SIGNING_KEY: ${{ secrets.TESSERA_SIGNING_KEY }}
        run: |
          if (-not $env:TESSERA_SIGNING_KEY) { throw 'Secret de assinatura ausente.' }
          python -c "from tessera_piano import __version__; import os; assert 'v'+__version__ == os.environ['GITHUB_REF_NAME'], 'A tag diverge da versão do aplicativo.'"
      - name: Instalar compilador do instalador
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { choco install innosetup --yes --no-progress }
      - run: python scripts/build.py --iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - name: Assinar manifesto
        env:
          TESSERA_SIGNING_KEY: ${{ secrets.TESSERA_SIGNING_KEY }}
        run: |
          $installer = Get-ChildItem dist/TesseraPiano-Setup-*-x64.exe | Select-Object -First 1
          python scripts/sign_release.py $installer.FullName
      - name: Preparar release em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/TesseraPiano-Setup-*-x64.exe dist/update.json dist/*.sha256 --title "Tessera Piano $env:GITHUB_REF_NAME" --notes-file dist/release-notes.md --verify-tag --draft --prerelease=${{ contains(github.ref_name, '-') }}
