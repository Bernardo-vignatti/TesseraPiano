[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-piano"
dynamic = ["version"]
description = "Biblioteca MIDI e interpretação musical por teclado para Visual Pianos."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Bernardo Vignatti"}]
dependencies = [
  "PySide6-Essentials==6.12.0",
  "mido==1.3.3",
  "cryptography==50.0.2",
  "packaging==26.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4", "pyinstaller==6.22.3"]

[project.gui-scripts]
tessera-piano = "tessera_piano.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "tessera_piano.__version__"}

[tool.setuptools.package-data]
tessera_piano = ["ui/*.qml", "ui/qmldir", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
